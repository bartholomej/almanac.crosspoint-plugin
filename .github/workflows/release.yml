name: 🚀 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: 🚀 Release

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: 🔎 Check the payload
        run: node scripts/check-release.ts "$GITHUB_REF_NAME"

      - name: 🚀 Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A block, because the colon in the title would end a plain YAML value.
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          --title "Almanac: Reading Stats ${GITHUB_REF_NAME#v}"
