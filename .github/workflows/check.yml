name: ✅ Check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: ✅ Check

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Node 25 and later no longer bundle Corepack, which pins Yarn to packageManager.
      - name: 📦 Install
        run: npm install --global corepack@latest && corepack enable && yarn install --immutable

      - name: 🔎 Types
        run: yarn typecheck

      - name: 🔎 Check the payload
        run: node scripts/check-release.ts
